<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VolunTeen</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1 class="logo">Volun<span>Teen</span></h1>
    <nav class="tabs">
      <button class="tab active" data-view="jobs">Jobs</button>
      <button class="tab" data-view="leagues">Leagues</button>
    </nav>
  </header>

  <main>
    <section id="view-jobs" class="view">
      <div class="filters">
        <input id="search" type="search" placeholder="Search jobs or events…">
        <select id="league-filter"><option value="">All leagues</option></select>
      </div>
      <div id="job-list" class="grid"></div>
    </section>

    <section id="view-leagues" class="view hidden">
      <p class="intro">Student leagues from Timișoara faculties.</p>
      <div id="league-list" class="grid"></div>
    </section>
  </main>

  <dialog id="job-dialog">
    <div id="job-detail"></div>
    <form method="dialog"><button class="btn secondary">Close</button></form>
  </dialog>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
